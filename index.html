<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E6B3F">
<title>Plat &amp; Plant</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F3EE; --surface:#FFFFFF; --sunk:#E6EAE2; --ink:#1E2A22; --muted:#5B685F; --line:#D6DDD3;
  --leaf:#2E6B3F; --leaf-soft:#DCEBDD; --water:#2470B3; --water-soft:#DBEAF6; --warn:#B0502A; --warn-soft:#F6E3D9;
  --amber:#8A6512; --amber-soft:#F4EBD0;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131915; --surface:#1C241F; --sunk:#252F28; --ink:#E5ECE6; --muted:#9BA89F; --line:#2F3A33;
    --leaf:#82C796; --leaf-soft:#22352A; --water:#73B6EC; --water-soft:#1B2E40; --warn:#EB9670; --warn-soft:#3A2419;
    --amber:#E3C26E; --amber-soft:#3A3119;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131915; --surface:#1C241F; --sunk:#252F28; --ink:#E5ECE6; --muted:#9BA89F; --line:#2F3A33;
  --leaf:#82C796; --leaf-soft:#22352A; --water:#73B6EC; --water-soft:#1B2E40; --warn:#EB9670; --warn-soft:#3A2419;
  --amber:#E3C26E; --amber-soft:#3A3119;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--water);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px 120px}

/* header */
.top h1{font-size:44px;line-height:1;margin:6px 0 6px;font-weight:700;letter-spacing:-.02em;font-variation-settings:"opsz" 96}
.top .date{color:var(--muted);margin:0}
.season{margin:18px 0 6px;display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.season svg{flex:none;margin-top:2px}
.season b{font-weight:600}
.season p{margin:0;color:var(--muted);font-size:15px}

h2{font-size:21px;font-weight:600;margin:30px 0 10px;letter-spacing:-.01em}
h2 .count{color:var(--muted);font-weight:400}

/* plant rows */
.row{display:flex;gap:14px;align-items:center;padding:12px;background:var(--surface);border-radius:16px;margin-bottom:10px;border:1px solid var(--line)}
.row.due{border-color:color-mix(in srgb,var(--water) 45%,var(--line))}
.row.late{border-color:color-mix(in srgb,var(--warn) 50%,var(--line))}
.thumb{width:64px;height:64px;border-radius:12px;object-fit:cover;flex:none;background:var(--sunk)}
.thumb.ph{display:grid;place-items:center;color:var(--muted)}
.row .info{flex:1;min-width:0;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.row .name{font-weight:600;font-size:18px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.row .meta{color:var(--muted);font-size:14.5px;margin-top:2px}
.row .when{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:14.5px}
.row .when.late{color:var(--warn);font-weight:600}
.row .when.due{color:var(--water);font-weight:600}
.chip{display:inline-block;font-size:13px;padding:2px 8px;border-radius:99px;background:var(--amber-soft);color:var(--amber);margin-left:4px;font-weight:500}
.water-btn{flex:none;border:0;border-radius:14px;background:var(--water);color:#fff;padding:12px 14px;font-weight:600;font-size:15px;line-height:1.15;min-width:86px}
:root[data-theme="dark"] .water-btn{color:#0E1A24}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .water-btn{color:#0E1A24}}
.water-btn small{display:block;font-weight:500;opacity:.85;font-size:12.5px}
.ghost-btn{flex:none;border:1px solid var(--line);border-radius:14px;background:transparent;padding:10px 12px;font-size:14.5px;color:var(--muted)}

.empty{text-align:center;padding:36px 20px;background:var(--surface);border:1px dashed var(--line);border-radius:18px;margin-top:24px}
.empty p{color:var(--muted);margin:6px 0 18px}
.allgood{display:flex;gap:12px;align-items:center;background:var(--leaf-soft);color:var(--leaf);padding:14px 16px;border-radius:14px;font-weight:500}

/* grid */
.room{margin-top:26px}
.room h2{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tile{position:relative;border:0;padding:0;border-radius:16px;overflow:hidden;aspect-ratio:4/5;background:var(--sunk);text-align:left}
.tile img{width:100%;height:100%;object-fit:cover}
.tile .lbl{position:absolute;left:0;right:0;bottom:0;padding:28px 12px 10px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.72))}
.tile .lbl b{display:block;font-size:17px;font-weight:600;line-height:1.2}
.tile .lbl span{font-size:13.5px;opacity:.9}
.tile .ph{width:100%;height:100%;display:grid;place-items:center;color:var(--muted)}
.tile .gauge{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.88);border-radius:99px;padding:5px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:20}
.tabs .in{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-around;padding:8px 10px}
.tab{background:none;border:0;padding:6px 14px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:500}
.tab[aria-current="page"]{color:var(--leaf)}
.add-fab{border:0;background:var(--leaf);color:var(--bg);width:54px;height:54px;border-radius:18px;display:grid;place-items:center;margin-top:-22px;box-shadow:0 6px 18px color-mix(in srgb,var(--leaf) 35%,transparent)}

/* sheet */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:30;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet[hidden]{display:none}
.sheet-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:10px 12px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.sheet-head h3{margin:0;font-size:18px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{border:0;background:var(--surface);width:42px;height:42px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line)}
.sheet .body{max-width:560px;margin:0 auto;padding:6px 18px 60px}

.hero{border-radius:20px;overflow:hidden;background:var(--sunk);aspect-ratio:4/3}
.hero img{width:100%;height:100%;object-fit:cover}
.hero .ph{width:100%;height:100%;display:grid;place-items:center;color:var(--muted)}
.d-title{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:16px 0 0;line-height:1.05}
.d-sub{color:var(--muted);margin:4px 0 0}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 6px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:13px 14px;font-weight:600;font-size:15.5px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--water);border-color:var(--water);color:#fff}
.btn.leaf{background:var(--leaf);border-color:var(--leaf);color:var(--bg)}
:root[data-theme="dark"] .btn.primary{color:#0E1A24}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#0E1A24}}
.btn.full{grid-column:1/-1;width:100%}
.btn:disabled{opacity:.55;cursor:default}
.btn.danger{color:var(--warn)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:12px}
.panel h4{margin:0 0 8px;font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px}
.panel p{margin:4px 0;font-size:15.5px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15.5px;margin:0}
.facts dt{color:var(--muted)}
.facts dd{margin:0}
.big-now{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.big-now .n{font-size:30px;font-weight:700;line-height:1}
.big-now .u{color:var(--muted);font-size:14.5px}
.status{display:inline-block;padding:3px 10px;border-radius:99px;font-size:13.5px;font-weight:600}
.status.goed{background:var(--leaf-soft);color:var(--leaf)}
.status.aandacht{background:var(--amber-soft);color:var(--amber)}
.status.slecht{background:var(--warn-soft);color:var(--warn)}
.status.onbekend{background:var(--sunk);color:var(--muted)}
.panel ul{margin:8px 0 0;padding-left:20px}
.panel li{margin:4px 0;font-size:15.5px}
.warn-line{color:var(--warn);font-weight:500}

/* forms */
label.f{display:block;margin-top:14px;font-size:14.5px;color:var(--muted);font-weight:500}
label.f input,label.f textarea,label.f select{display:block;width:100%;margin-top:5px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px;color:var(--ink)}
label.f textarea{min-height:76px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;gap:10px;align-items:center;margin-top:16px;font-size:15.5px}
.check input{width:20px;height:20px}
.photo-pick{display:block;border:2px dashed var(--line);border-radius:18px;background:var(--surface);aspect-ratio:4/3;overflow:hidden;position:relative;cursor:pointer}
.photo-pick img{width:100%;height:100%;object-fit:cover}
.photo-pick .prompt{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:8px;color:var(--muted);text-align:center;padding:20px}
.photo-pick input{position:absolute;inset:0;opacity:0;cursor:pointer}
.hint{font-size:14px;color:var(--muted);margin:8px 0 0}
.thinking{display:flex;gap:10px;align-items:center;padding:14px 16px;background:var(--water-soft);color:var(--water);border-radius:14px;margin-top:14px;font-weight:500}
.spin{width:18px;height:18px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.err{padding:12px 14px;background:var(--warn-soft);color:var(--warn);border-radius:12px;margin-top:12px;font-size:15px}
.note{padding:12px 14px;background:var(--sunk);border-radius:12px;margin-top:12px;font-size:15px;color:var(--muted)}

.toast{position:fixed;left:50%;transform:translateX(-50%);width:min(440px,calc(100% - 28px));justify-content:space-between;bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 14px 11px 16px;border-radius:14px;display:flex;gap:14px;align-items:center;z-index:50;font-size:15px;max-width:calc(100% - 28px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast button{background:none;border:0;color:var(--bg);font-weight:700;text-decoration:underline;padding:4px}
.status-line{color:var(--muted);font-size:14px;margin-top:10px}

/* Plat & Plant additions */
.brand{display:flex;align-items:center;justify-content:space-between;margin:0 0 6px}
.wordmark{font-weight:700;font-size:19px;letter-spacing:-.01em;color:var(--leaf)}
.wordmark .amp{font-weight:400;font-style:italic;color:var(--water)}
.linkish{background:none;border:0;padding:0;color:var(--water);text-decoration:underline;font-size:inherit}
.search-row{display:flex;gap:8px;align-items:flex-end}
.search-row .btn{padding:11px 16px}
.cands{margin-top:14px}
.cand{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:8px}
.cand b{display:block;font-weight:600}
.cand span{font-size:14px;color:var(--muted)}
.symptoms{display:grid;gap:8px;margin-top:12px}
.sym{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:15.5px}
.sym input{width:20px;height:20px;flex:none;accent-color:var(--leaf)}
.sym:has(input:checked){border-color:var(--leaf);background:var(--leaf-soft)}
.photo-pick.small{aspect-ratio:16/7;margin-top:16px}
.file-btn{position:relative;overflow:hidden;cursor:pointer}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* shared list */
.listname{margin:4px 0 0;color:var(--leaf);font-weight:600}
.req-banner{display:block;width:100%;text-align:left;margin-top:14px;border:1px solid var(--amber);background:var(--amber-soft);color:var(--amber);border-radius:14px;padding:12px 14px;font-weight:600;font-size:15.5px}
.panel h4.sub{margin:16px 0 4px;font-size:14.5px;color:var(--muted);font-weight:600}
.mrow{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.mname b{display:block;font-weight:600}
.mname span{font-size:14px;color:var(--muted)}
.mact{display:flex;gap:6px;flex-wrap:wrap}
.btn.mini{padding:7px 10px;font-size:14px;border-radius:10px}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:22px;letter-spacing:.06em;text-align:center;background:var(--sunk);border-radius:12px;padding:14px 8px;margin:12px 0;overflow-wrap:anywhere}
</style>
</head>
<body>
<main class="wrap" id="main" aria-live="polite"></main>
<nav class="tabs" aria-label="Navigatie">
  <div class="in">
    <button class="tab" data-tab="today" aria-current="page">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3s-6 7-6 11a6 6 0 0 0 12 0c0-4-6-11-6-11z"/></svg>
      Vandaag
    </button>
    <button class="add-fab" id="addBtn" aria-label="Plant toevoegen">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="tab" data-tab="plants">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21v-8"/><path d="M12 13c0-4 3-7 8-7 0 4-3 7-8 7z"/><path d="M12 15c0-3-2.5-5.5-7-5.5 0 3 2.5 5.5 7 5.5z"/><path d="M7 21h10"/></svg>
      Planten
    </button>
  </div>
</nav>
<section class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></section>
<div id="toastHost"></div>
<script src="planten-db.js"></script>
<script>
(() => {
"use strict";

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
const num = (v, d) => { const n = Number(v); return v !== "" && v !== null && Number.isFinite(n) ? n : d; };
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const todayStr = () => ymd(new Date());
const parseYmd = s => { const [y,m,d] = String(s).split("-").map(Number); return new Date(y, m-1, d); };
const dayDiff = (a, b) => Math.round((parseYmd(b) - parseYmd(a)) / 86400000);
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const fmtDate = s => parseYmd(s).toLocaleDateString("nl-NL", { weekday:"short", day:"numeric", month:"short" });
const safeImg = s => typeof s === "string" && /^data:image\/(jpeg|png|webp);base64,/.test(s) ? s : "";
const str = v => typeof v === "string" ? v.trim().slice(0, 1200) : "";
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, " ").trim();
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

const LEAF_SVG = `<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21v-8"/><path d="M12 13c0-4 3-7 8-7 0 4-3 7-8 7z"/><path d="M12 15c0-3-2.5-5.5-7-5.5 0 3 2.5 5.5 7 5.5z"/></svg>`;
const GEAR_SVG = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>`;

/* ---------- storage on this phone (IndexedDB) ---------- */
const store = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open("platplant", 2);
      r.onupgradeneeded = () => {
        const d = r.result;
        if (!d.objectStoreNames.contains("plants")) d.createObjectStore("plants", { keyPath: "id" });
        if (!d.objectStoreNames.contains("settings")) d.createObjectStore("settings");
        if (!d.objectStoreNames.contains("photos")) d.createObjectStore("photos", { keyPath: "id" });
      };
      r.onsuccess = () => { this.db = r.result; this.db.onversionchange = () => this.db.close(); res(); };
      r.onerror = () => rej(r.error);
    });
  },
  req(name, mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(name, mode);
      const q = fn(t.objectStore(name));
      t.oncomplete = () => res(q?.result);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error);
    });
  },
  all() { return this.req("plants", "readonly", s => s.getAll()); },
  getPlant(id) { return this.req("plants", "readonly", s => s.get(id)); },
  put(p) { return this.req("plants", "readwrite", s => s.put(p)); },
  del(id) { return this.req("plants", "readwrite", s => s.delete(id)); },
  clear() { return this.req("plants", "readwrite", s => s.clear()); },
  get(k) { return this.req("settings", "readonly", s => s.get(k)); },
  set(k, v) { return this.req("settings", "readwrite", s => s.put(v, k)); },
  photoAll() { return this.req("photos", "readonly", s => s.getAll()); },
  photoPut(id, v, data) { return this.req("photos", "readwrite", s => s.put({ id, v, data })); },
  photoDel(id) { return this.req("photos", "readwrite", s => s.delete(id)); }
};

/* Planten alleen op deze telefoon */
const localBackend = {
  async list() { return (await store.all()) || []; },
  async patch(id, fields, create = false) {
    const cur = await store.getPlant(id);
    if (!cur && !create) throw { msg: "Deze plant bestaat niet meer." };
    const p = { ...(cur || {}), ...fields, id };
    if (!fields.foto && cur) p.foto = cur.foto || "";
    await store.put(p);
    return p;
  },
  del(id) { return store.del(id); },

  admin_cannot_leave: "Als beheerder kun je de lijst niet verlaten. Maak eerst iemand anders beheerder.",

function dbErr(j) {

  if (j?.code === "PGRST202" || j?.code === "42P01" || j?.code === "PGRST205" || /schema cache|does not exist/i.test(m))
    return "De database is nog niet ingericht. Voer het setup-script uit in Supabase.";
  if (/row-level security/i.test(m)) return "Je hebt geen toegang tot deze lijst.";
  return "De database gaf een fout. Probeer het opnieuw.";
}
function authErr(j) {
  const m = String(j?.msg || j?.message || j?.error_description || j?.error || "");
  if (/anonymous/i.test(m) || j?.error_code === "anonymous_provider_disabled")
    return "Anoniem inloggen staat uit. Zet in Supabase bij Authentication de optie Allow anonymous sign-ins aan.";
  if (/api ?key|apikey|invalid.*key|unregistered/i.test(m)) return "De sleutel van de database klopt niet.";
  if (/rate|too many/i.test(m)) return "Te veel aanmeldingen in korte tijd. Probeer het over een uur opnieuw.";
  return "Inloggen bij de database lukte niet. Controleer de gegevens en probeer het opnieuw.";
}
const cloud = {
  cfg: null, // { url, key, household, name, display, role, status, invite, session }
  async saveCfg() { await store.set("cloud", this.cfg); },
  setSession(j) {
    this.cfg.session = {
      access_token: j.access_token, refresh_token: j.refresh_token,
      expires_at: j.expires_at || Math.floor(Date.now() / 1000) + (j.expires_in || 3600),
      user_id: j.user?.id || this.cfg.session?.user_id || null

  async token() {
    const saved = await store.get("cloud").catch(() => null);

    const s = this.cfg.session;
    if (!s) throw { msg: "Je bent niet ingelogd bij de gedeelde lijst." };
    if (s.expires_at - 60 > Date.now() / 1000) return s.access_token;
    let r;
    try {
      r = await fetch(this.cfg.url + "/auth/v1/token?grant_type=refresh_token", { method: "POST", headers: { apikey: this.cfg.key, "Content-Type": "application/json" }, body: JSON.stringify({ refresh_token: s.refresh_token }) });
    } catch { throw { msg: "Geen verbinding met de database. Controleer je internet.", offline: true }; }
    const j = await r.json().catch(() => null);
    if (!r.ok || !j?.access_token) throw { msg: "Je inlog is verlopen. Vraag opnieuw toegang via de uitnodigingslink.", auth: true };
    this.setSession(j);
    await this.saveCfg();
    return j.access_token;
  },
  async req(path, { method = "GET", body, prefer } = {}) {
    const t = await this.token();
    let r;

      r = await fetch(this.cfg.url + path, {
        method,
        headers: { apikey: this.cfg.key, Authorization: "Bearer " + t, "Content-Type": "application/json", ...(prefer ? { Prefer: prefer } : {}) },
        body: body === undefined ? undefined : JSON.stringify(body)
      });
    } catch { throw { msg: "Geen verbinding met de database. Controleer je internet.", offline: true }; }
    if (r.status === 204) return null;
    const j = await r.json().catch(() => null);
    if (!r.ok) throw { msg: dbErr(j), code: j?.code };
    return j;
  },
  rpc(fn, args) { return this.req("/rest/v1/rpc/" + fn, { method: "POST", body: args || {} }); },
  hid() { return encodeURIComponent(this.cfg.household); },
  async list() {
    const rows = await this.req(`/rest/v1/plants?select=id,data&household_id=eq.${this.hid()}`);
    const plants = (rows || []).map(r => ({ ...(r.data || {}), id: r.id }));
    store.set("cloudCache", plants).catch(() => {});
    this.syncPhotos().catch(() => {});
    return plants;
  },
  async syncPhotos() {
    const rows = (await this.req(`/rest/v1/photos?select=plant_id,version&household_id=eq.${this.hid()}`)) || [];
    const cached = (await store.photoAll()) || [];
    const have = new Map(cached.map(c => [c.id, c.v]));
    const want = new Set(rows.map(r => r.plant_id));
    for (const c of cached) if (!want.has(c.id)) { await store.photoDel(c.id); delete state.photoCache[c.id]; }
    const stale = rows.filter(r => have.get(r.plant_id) !== r.version).map(r => r.plant_id).filter(id => /^[a-z0-9]{6,40}$/.test(id));
    for (let i = 0; i < stale.length; i += 4) {
      const got = (await this.req(`/rest/v1/photos?select=plant_id,data,version&plant_id=in.(${stale.slice(i, i + 4).join(",")})`)) || [];
      for (const g of got) if (safeImg(g.data)) { await store.photoPut(g.plant_id, g.version, g.data); state.photoCache[g.plant_id] = g.data; }
    }
    if (stale.length) { render(); if (sheetCtx?.mode === "detail") renderSheet(); }
  },
  async patch(id, fields, create = false) {
    const { foto, ...rest } = fields;
    const data = await this.rpc("patch_plant", { p_id: id, p_household: this.cfg.household, p_fields: rest, p_create: create });
    if (foto && safeImg(foto)) {
      const v = Date.now();
      await this.req("/rest/v1/photos?on_conflict=plant_id", { method: "POST", prefer: "resolution=merge-duplicates,return=minimal", body: { plant_id: id, household_id: this.cfg.household, data: foto, version: v } });
      await store.photoPut(id, v, foto);
      state.photoCache[id] = foto;
    }
    return { ...(data || {}), id };
  },
  async del(id) {
    await this.req(`/rest/v1/plants?id=eq.${encodeURIComponent(id)}&household_id=eq.${this.hid()}`, { method: "DELETE", prefer: "return=minimal" });
    await store.photoDel(id).catch(() => {});
    delete state.photoCache[id];
  },
  async importAll(list) {
    await this.req(`/rest/v1/plants?household_id=eq.${this.hid()}`, { method: "DELETE", prefer: "return=minimal" });
    return this.addAll(list);
  },
  async addAll(list) {
    let n = 0;
    for (const p of list) {
      if (!p || !/^[a-z0-9]{6,40}$/.test(p.id || "")) continue;
      const { id, ...f } = p;
      await this.patch(id, f, true);
      n++;
    }
    return { count: n };
  },
  async exportAll() {
    const plants = await this.list();
    await this.syncPhotos().catch(() => {});
    return { app: "plat-en-plant", versie: 1, gemaakt: new Date().toISOString(),
      planten: plants.map(p => ({ ...p, ...(state.photoCache[p.id] ? { foto: state.photoCache[p.id] } : {}) })) };
  }
};

/* invitation links */
const b64enc = s => btoa(unescape(encodeURIComponent(s))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const b64dec = s => decodeURIComponent(escape(atob(s.replace(/-/g, "+").replace(/_/g, "/"))));
const cleanUrl = u => String(u || "").trim().replace(/\/+$/, "").replace(/\/rest\/v1$/, "");
const validUrl = u => /^https:\/\/[a-z0-9.-]+(:\d+)?$/i.test(u);
function parseInvite(text) {
  const m = String(text || "").match(/#join=([A-Za-z0-9_-]+)/);
  if (!m) return null;
  try {
    const j = JSON.parse(b64dec(m[1]));
    if (validUrl(cleanUrl(j.u)) && typeof j.k === "string" && j.k.length > 10 && typeof j.c === "string") return { u: cleanUrl(j.u), k: j.k, c: j.c, n: str(j.n).slice(0, 60) };
  } catch {}
  return null;
}
function inviteLink() {
  const cf = cloud.cfg;
  return location.origin + location.pathname + "#join=" + b64enc(JSON.stringify({ u: cf.url, k: cf.key, c: cf.invite, n: cf.name }));
}

/* ---------- seasons ---------- */
function season(d = new Date()) {
  const m = d.getMonth() + 1;
  if (m >= 4 && m <= 9) return "groei";
  if (m === 3 || m === 10) return "overgang";
  return "rust";
}
const SEASON_TEXT = {
  groei: ["Groeiseizoen", "April tot en met september. Planten groeien en krijgen vaker water en voeding."],
  overgang: ["Overgangsmaand", "Planten krijgen water in een ritme tussen zomer en winter in. Geen voeding."],
  rust: ["Rustperiode", "November tot en met februari. Minder vaak water geven en geen voeding."]
};
function intervalFor(p, s = season()) {
  const g = clamp(num(p.waterGroeiDagen, 7), 1, 60);
  const r = clamp(num(p.waterRustDagen, g * 2), 1, 90);
  if (s === "groei") return g;
  if (s === "rust") return r;
  return Math.round((g + r) / 2);
}
function amountFor(p, s = season()) {
  const ml = clamp(num(p.waterMl, 200), 10, 5000);
  return s === "rust" ? Math.max(10, Math.round(ml * 0.8 / 10) * 10) : ml;
}
function waterStatus(p) {
  const iv = intervalFor(p), t = todayStr();
  if (!p.lastWatered) return { daysLeft: 0, iv, next: t, never: true };
  const next = addDays(p.lastWatered, iv);
  return { daysLeft: dayDiff(t, next), iv, next };
}
function feedStatus(p) {
  const w = num(p.voedingWeken, 0);
  if (!w || season() !== "groei") return null;
  if (!p.lastFed) return { due: true, daysLeft: 0 };
  const left = dayDiff(todayStr(), addDays(p.lastFed, w * 7));
  return { due: left <= 0, daysLeft: left };
}
function whenText(st) {
  if (st.never) return "Vandaag";
  if (st.daysLeft < -1) return `${-st.daysLeft} dagen te laat`;
  if (st.daysLeft === -1) return "Gisteren al";
  if (st.daysLeft === 0) return "Vandaag";
  if (st.daysLeft === 1) return "Morgen";
  return `Over ${st.daysLeft} dagen`;
}

/* The signature element: a drop that drains as the next watering approaches */
let gid = 0;
function gauge(st, size = 20) {
  const level = st.never ? 0 : clamp(st.daysLeft / st.iv, 0, 1);
  const id = "g" + (++gid);
  const color = st.daysLeft < 0 ? "var(--warn)" : "var(--water)";
  const h = 30 * level;
  return `<svg width="${size}" height="${Math.round(size*1.33)}" viewBox="0 0 24 32" aria-hidden="true">
    <defs><clipPath id="${id}"><path d="M12 1C12 1 2 13 2 21a10 10 0 0 0 20 0C22 13 12 1 12 1Z"/></clipPath></defs>
    <rect x="0" y="${31 - h}" width="24" height="${h + 1}" fill="${color}" clip-path="url(#${id})"/>
    <path d="M12 1C12 1 2 13 2 21a10 10 0 0 0 20 0C22 13 12 1 12 1Z" fill="none" stroke="${color}" stroke-width="2"/>
  </svg>`;
}

/* ---------- plant knowledge ---------- */
const DB = window.PLANTEN_DB || [];
function findBySci(species, genus, family) {
  const s = norm(species), g = norm(genus), f = norm(family);
  return (s && DB.find(e => e.k.some(k => k.includes(" ") && (s === k || s.startsWith(k + " ")))))
      || (g && DB.find(e => e.k.includes(g)))
      || (f && DB.find(e => e.k.includes(f)))
      || null;
}
function findByName(q) {
  const n = norm(q);
  if (!n) return [];
  const scored = [];
  DB.forEach(e => {
    const words = [...e.a, ...e.k, norm(e.n)].map(norm);
    let score = 0;
    if (words.includes(n)) score = 3;
    else if (words.some(w => w.startsWith(n) || n.startsWith(w))) score = 2;
    else if (n.length >= 4 && words.some(w => w.includes(n) || (w.length >= 4 && n.includes(w)))) score = 1;
    if (score) scored.push({ e, score });
  });
  return scored.sort((a, b) => b.score - a.score).slice(0, 5).map(x => x.e);
}
function scaleMl(base, pot) {
  const p = clamp(num(pot, 14), 5, 80);
  return clamp(Math.round(base * Math.pow(p / 14, 2) / 10) * 10, 20, 4000);
}
function dataFromEntry(e, ctx, extra = {}) {
  return {
    label: ctx.label || e.n, naam: e.n, soort: extra.soort || "", kamer: ctx.room, pot: ctx.pot ? num(ctx.pot, null) : null,
    waterGroeiDagen: e.g, waterRustDagen: e.r, waterMl: scaleMl(e.ml, ctx.pot), waterTip: e.wt,
    voedingWeken: e.v, voedingTip: e.vt, licht: e.l, vochtigheid: e.h, giftig: e.t, verzorging: e.c,
    over: extra.over || "", bron: extra.bron || ""
  };
}

/* ---------- online lookups ---------- */
async function wikiLookup(q, signal) {
  const s = await fetch(`https://nl.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(q)}&srlimit=1&format=json&origin=*`, { signal }).then(r => r.json());
  const title = s?.query?.search?.[0]?.title;
  if (!title) return null;
  const sum = await fetch(`https://nl.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title.replace(/ /g, "_"))}`, { signal }).then(r => r.ok ? r.json() : null);
  if (!sum?.extract) return null;
  return { title, text: str(sum.extract).slice(0, 700) };
}
async function plantnetIdentify(blob, key, signal) {
  const fd = new FormData();
  fd.append("images", blob, "plant.jpg");
  fd.append("organs", "auto");
  let r;
  try {
    r = await fetch(`https://my-api.plantnet.org/v2/identify/all?api-key=${encodeURIComponent(key)}&lang=nl&nb-results=4&include-related-images=false`, { method: "POST", body: fd, signal });
  } catch (e) {
    if (e.name === "AbortError") throw e;
    throw { msg: "Pl@ntNet is niet bereikbaar. Controleer je internet, en of het webadres van deze app bij Pl@ntNet bij Authorized domains staat." };
  }
  if (r.status === 404) return [];
  if (r.status === 401 || r.status === 403) throw { msg: "De Pl@ntNet-sleutel klopt niet of is niet vrijgegeven voor dit webadres. Controleer de instellingen." };
  if (r.status === 429) throw { msg: "Het dagelijkse maximum van Pl@ntNet is bereikt. Probeer het morgen opnieuw." };
  if (!r.ok) throw { msg: "Pl@ntNet kon de foto niet verwerken. Probeer een scherpere foto met de bladeren goed in beeld." };
  const j = await r.json();
  return (j.results || []).map(x => ({
    score: x.score,
    species: x.species?.scientificNameWithoutAuthor || "",
    genus: x.species?.genus?.scientificNameWithoutAuthor || "",
    family: x.species?.family?.scientificNameWithoutAuthor || "",
    common: (x.species?.commonNames || [])[0] || ""
  })).filter(x => x.species);
}

  const rooms = {};

const sheet = $("#sheet");
let sheetCtx = null, abortCtl = null;
function openSheet(ctx) { abortCtl?.abort(); sheetCtx = ctx; renderSheet(); sheet.hidden = false; sheet.scrollTop = 0; document.body.style.overflow = "hidden"; setTimeout(() => sheet.querySelector(".icon-btn")?.focus(), 30); }
function closeSheet() { abortCtl?.abort(); sheetCtx = null; sheet.hidden = true; sheet.innerHTML = ""; document.body.style.overflow = ""; }
function head(title, back = "close") {
  return `<div class="sheet-head"><button class="icon-btn" data-sheet="${back}" aria-label="Terug"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button><h3>${esc(title)}</h3></div>`;
}
function renderSheet() {
  if (!sheetCtx) return;
  const c = sheetCtx;
  if (c.mode === "detail") {
    const p = byId(c.id); if (!p) { closeSheet(); return; }
    sheet.innerHTML = head(p.label) + `<div class="body">${detailBody(p)}</div>`;
  } else if (c.mode === "add") {
    sheet.innerHTML = head("Plant toevoegen") + `<div class="body">${addBody()}</div>`;
  } else if (c.mode === "form") {
    sheet.innerHTML = head(c.editId ? "Plant bewerken" : "Gegevens controleren", c.editId ? "detail" : "add") + `<div class="body">${formBody()}</div>`;
  } else if (c.mode === "health") {
    sheet.innerHTML = head("Gezondheidscheck", "detail") + `<div class="body">${healthBody(byId(c.id))}</div>`;
  } else if (c.mode === "cloudCreate") {
    sheet.innerHTML = head(c.done ? "Gedeelde lijst" : "Gedeelde lijst maken", c.done ? "close" : "settings") + `<div class="body">${cloudCreateBody()}</div>`;
  } else if (c.mode === "cloudJoin") {
    sheet.innerHTML = head(c.recover ? "Beheerder herstellen" : "Meedoen met een lijst", "settings") + `<div class="body">${cloudJoinBody()}</div>`;
  } else if (c.mode === "pushSetup") {
    sheet.innerHTML = head("Meldingen instellen", "settings") + `<div class="body">${pushSetupBody()}</div>`;
  } else if (c.mode === "settings") {
    sheet.innerHTML = head("Instellingen") + `<div class="body">${settingsBody()}</div>`;
  }
}

async function identifyPhoto() {
  readAddInputs();
  const c = sheetCtx;
  c.busy = "De foto wordt naar Pl@ntNet gestuurd…"; c.error = ""; c.cands = []; renderSheet();
  abortCtl = new AbortController();
  try {
    const res = await plantnetIdentify(c.blob, state.key, abortCtl.signal);
    c.busy = "";
    if (!res.length) { c.error = "Pl@ntNet herkent deze plant niet. Probeer een foto van dichtbij met de bladeren goed zichtbaar, of typ de naam."; renderSheet(); return; }
    c.cands = res.map(r => {
      const e = findBySci(r.species, r.genus, r.family);
      return { kind: "pn", r, e, title: e ? e.n : (r.common ? cap(r.common) : r.species), sub: `${r.species}, ${Math.round(r.score * 100)}% zeker${e ? "" : ", info via Wikipedia"}` };
    });
    c.candNote = res[0].score < 0.3 ? "Pl@ntNet twijfelt. Kies de plant die het best past:" : "Kies de plant die het best past:";
    renderSheet();
  } catch (e) {
    if (e?.name === "AbortError") return;
    c.busy = ""; c.error = e?.msg || "Herkennen lukte niet. Probeer het opnieuw of typ de naam."; renderSheet();
  }
}
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

function nameSearch() {

function diagnose(p, sel, grond) {
  const s = season(), iv = intervalFor(p), sug = [], dx = [];
  const any = Object.keys(sel).length;
  if (!any) return { status: "goed", samenvatting: "Geen klachten aangevinkt. Ga zo door.", suggesties: [], datum: todayStr() };
  const has = k => !!sel[k];
  let ritme = null, status = "aandacht";
  const seasonField = s === "groei" ? "waterGroeiDagen" : "waterRustDagen";

  if (has("zacht")) {
    status = "slecht"; dx.push("Waarschijnlijk wortelrot door te veel water.");
    sug.push("Haal de plant uit de pot en bekijk de wortels. Knip bruine, zachte wortels weg en verpot in verse, droge potgrond in een pot met gaten in de bodem.");
    sug.push("Geef na het verpotten een week geen water.");
  }
  if (has("beestjes")) {
    status = "slecht"; dx.push("Er zit waarschijnlijk ongedierte op, zoals spint, wolluis of trips.");
    sug.push("Zet de plant apart van de andere planten.");
    sug.push("Spoel de bladeren af onder de douche en veeg ook de onderkant schoon. Herhaal dit een paar weken lang elke week.");
    sug.push("Helpt dat niet, gebruik dan een middel op basis van groene zeep of neemolie uit het tuincentrum.");
  }
  const teNat = grond === "nat" && (has("geel") || has("slap") || has("schimmel") || has("bladval") || has("zacht"));
  const teDroog = grond === "droog" && (has("slap") || has("krul") || has("bruinrand") || has("geel"));
  if (teNat || (has("schimmel") && grond !== "droog")) {
    dx.push("De plant krijgt waarschijnlijk te veel water.");
    sug.push("Sla de volgende beurt over en laat de bovenste 3 cm van de grond opdrogen.");
    sug.push("Giet water weg dat in de sierpot of op het schoteltje blijft staan.");
    const oud = num(p[seasonField], iv);
    ritme = { veld: seasonField, oud, nieuw: Math.min(60, Math.max(oud + 1, Math.round(oud * 1.3))) };
    if (ritme.nieuw === oud) ritme = null;
  } else if (teDroog) {
    dx.push("De plant heeft waarschijnlijk dorst.");
    sug.push(`Geef nu grondig water: zet de pot een kwartier in een bak water en laat hem goed uitlekken.`);
    const oud = num(p[seasonField], iv);
    if (oud > 2) ritme = { veld: seasonField, oud, nieuw: Math.max(1, Math.round(oud * 0.75)) };
  }
  if (has("bruinrand") && !teDroog) {
    dx.push("Bruine randen komen meestal door droge lucht of kalk in het kraanwater.");
    sug.push("Zet de plant niet vlak bij de verwarming en gebruik regenwater of water dat een nacht heeft gestaan.");
    if (s !== "groei") sug.push("In de winter is de lucht binnen extra droog. Een schaal water bij de plant of planten bij elkaar zetten helpt.");
  }
  if (has("vlekken")) {
    dx.push("Vlekken aan de kant van het raam zijn vaak verbranding door felle zon.");
    sug.push("Zet de plant iets verder van het raam of achter een vitrage. Zitten de vlekken overal met een gele rand, kijk dan of de grond niet te nat is.");
  }
  if (has("lang")) {
    dx.push("De plant krijgt te weinig licht.");
    sug.push(s === "groei" ? "Zet de plant dichter bij een raam." : "Zet de plant dichter bij een raam. In de winter is het binnen overal donkerder; een groeilamp kan helpen.");
  }
  if (has("bladval")) {
    dx.push("Bladval komt vaak door een nieuwe plek, tocht of kou.");
    sug.push("Laat de plant op een vaste, lichte plek staan, uit de tocht en niet tegen een koud raam.");
  }
  if (has("krul") && !teDroog && grond !== "nat") {
    sug.push("Krullende bladeren kunnen ook komen door felle zon, droge lucht of ongedierte. Kijk goed aan de onderkant van de bladeren.");
  }
  if (has("geel") && !teNat && !teDroog) {
    dx.push("Een geel blad onderaan is af en toe normaal: de plant ruimt oude bladeren op.");
    if (!grond) sug.push("Voel met je vinger 3 cm diep in de grond. Nat wijst op te veel water, droog op te weinig.");
  }
  if (has("groeitniet") || (has("geel") && !teNat && !teDroog)) {
    if (s !== "groei") {
      dx.push("Buiten het groeiseizoen groeien de meeste planten nauwelijks. Dat is normaal.");
    } else {
      const fd = feedStatus(p), fw = num(p.voedingWeken, 0);
      if (fw && (!p.lastFed || fd?.due)) sug.push("Geef voeding: de plant groeit nu en heeft al een tijd geen voeding gehad.");
      else if (!fw) sug.push("Geef eens per maand een halve dosis plantenvoeding om te zien of hij reageert.");
      sug.push("Kijk of er wortels uit de onderkant van de pot groeien. Dan staat hij te krap: verpot naar een pot die 2 tot 4 cm groter is.");
    }
  }
  if (!grond && !teNat && !teDroog && (has("slap") || has("krul"))) sug.push("Voel met je vinger 3 cm diep in de grond. Nat wijst op te veel water, droog op te weinig.");
  if (!dx.length) dx.push("Houd de plant de komende weken goed in de gaten.");
  const uniq = [...new Set(sug)].slice(0, 7);
  return { status, samenvatting: dx.join(" "), suggesties: uniq, ritme, datum: todayStr() };
}

/* --- notifications --- */
const swReady = () => "serviceWorker" in navigator ? Promise.race([navigator.serviceWorker.ready, new Promise(r => setTimeout(() => r(null), 4000))]) : Promise.resolve(null);
const notifState = { support: "?", permission: typeof Notification === "undefined" ? "unsupported" : Notification.permission };
async function checkNotifSupport() {
  if (typeof Notification === "undefined" || !("serviceWorker" in navigator)) { notifState.support = "nee"; return; }
  try {
    const reg = await swReady();
    if (!reg || !("periodicSync" in reg)) { notifState.support = "nee"; return; }
    const st = await navigator.permissions.query({ name: "periodic-background-sync" });
    notifState.support = st.state === "granted" ? "ja" : "geweigerd";
  } catch { notifState.support = "nee"; }
}
function localNotifPanel() {
  if (typeof Notification !== "undefined") notifState.permission = Notification.permission;
  const m = state.meldingen, on = m.aan && notifState.permission === "granted";
  let status;
  if (notifState.permission === "unsupported") status = "Deze telefoon of browser ondersteunt geen meldingen.";
  else if (notifState.permission === "denied") status = "Meldingen zijn geblokkeerd. Zet ze aan via Instellingen van je telefoon, dan Apps, Chrome, Meldingen.";
  else if (on && notifState.support === "ja") status = "Aan. De app kijkt op de achtergrond of er planten water nodig hebben.";
  else if (on && notifState.support === "geweigerd") status = "Meldingen mogen, maar de controle op de achtergrond is niet toegestaan. Dat lukt alleen als de app via Chrome als app is geïnstalleerd.";
  else if (on) status = "Meldingen mogen, maar deze telefoon kan de app niet op de achtergrond laten controleren. Je krijgt dan geen automatische meldingen.";
  else status = "Uit.";
  return `
  <div class="panel">
    <h4>Meldingen</h4>
    <p>${esc(status)}</p>
    ${notifState.permission === "unsupported" ? "" : `
    ${on ? `<button class="btn full" style="margin-top:10px" data-notif-off>Meldingen uitzetten</button>`
         : notifState.permission !== "denied" ? `<button class="btn leaf full" style="margin-top:10px" data-notif-on>Meldingen aanzetten</button>` : ""}
    <div class="symptoms" style="margin-top:14px" role="radiogroup" aria-label="Soort melding">
      <label class="sym"><input type="radio" name="nmode" value="stil" ${m.stil ? "checked" : ""}><span>Alleen op het scherm, zonder geluid of trillen</span></label>
      <label class="sym"><input type="radio" name="nmode" value="geluid" ${!m.stil ? "checked" : ""}><span>Met geluid en trillen</span></label>
    </div>
    ${on ? `<button class="btn full" style="margin-top:10px" data-notif-test>Testmelding sturen</button>` : ""}
    <p class="hint">Je krijgt hooguit één melding per dag, en niet tussen 22:00 en 08:00. Je telefoon bepaalt zelf het precieze moment. Gebruik je de app weinig of staat batterijbesparing aan, dan komt de melding soms later of niet.</p>`}
  </div>`;
}
async function notifOn() {
  try {
    const perm = await Notification.requestPermission();
    notifState.permission = perm;
    if (perm !== "granted") { renderSheet(); return; }
    state.meldingen.aan = true;
    await store.set("meldingen", state.meldingen);
    const reg = await swReady();
    if (reg && "periodicSync" in reg) {
      try { await reg.periodicSync.register("plant-check", { minInterval: 12 * 60 * 60 * 1000 }); } catch {}
    }
    await checkNotifSupport();
  } catch {}
  renderSheet();
}
async function notifOff() {
  state.meldingen.aan = false;
  await store.set("meldingen", state.meldingen);
  try { const reg = await swReady(); if (reg && "periodicSync" in reg) await reg.periodicSync.unregister("plant-check"); } catch {}
  renderSheet();
}
async function notifTest() {
  try {
    const reg = await swReady();
    if (!reg) throw 0;
    const due = state.plants.filter(p => waterStatus(p).daysLeft <= 0).map(p => p.label);
    await reg.showNotification("Plat & Plant", {
      body: due.length ? `Testmelding. Water nodig: ${due.join(", ")}.` : "Testmelding. Zo ziet een melding eruit.",
      icon: "icon-192.png", badge: "icon-192.png", tag: "test",
      silent: !!state.meldingen.stil, ...(state.meldingen.stil ? {} : { vibrate: [200, 100, 200] })

/* --- timed notifications through the household's own Supabase --- */
const push = { key: undefined, sub: null, checking: false };
const b64uBytes = s => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((s.length + 3) % 4)), c => c.charCodeAt(0));
const bytesB64u = b => btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const isBrave = () => !!navigator.brave;

async function pushRefresh() {
  if (push.checking || !isCloud()) return;
  push.checking = true;
  try { push.key = (await cloud.rpc("push_public_key", {})) || null; } catch { push.key = null; }
  try {
    const reg = await swReady();
    push.sub = reg?.pushManager ? await reg.pushManager.getSubscription() : null;
  } catch { push.sub = null; }
  push.checking = false;
  if (sheetCtx?.mode === "settings") renderSheet();
}
function notifPanel() {
  if (!isCloud()) return localNotifPanel();
  if (push.key === undefined) { pushRefresh(); return `<div class="panel"><h4>Meldingen</h4><p class="hint">Even kijken wat er mogelijk is…</p></div>`; }
  if (!push.key) {
    const admin = cloud.cfg.role === "admin";
    return `
  <div class="panel">
    <h4>Meldingen op een vast tijdstip</h4>
    <p>${admin ? "Dit is nog niet ingesteld voor deze lijst. Het kost je eenmalig een kwartier in Supabase."
                : "De beheerder van de lijst moet dit eerst instellen. Tot die tijd bepaalt je telefoon zelf het moment van de melding."}</p>
    ${admin ? `<button class="btn leaf full" style="margin-top:10px" data-push-setup>Instellen</button>` : ""}
  </div>
  ${localNotifPanel()}`;
  }
  if (typeof Notification === "undefined" || !("PushManager" in window)) return `
  <div class="panel"><h4>Meldingen</h4><p>Deze browser kan geen meldingen ontvangen. Gebruik je een iPhone? Zet de app dan op je beginscherm en open hem daar.</p></div>`;
  const m = state.meldingen, on = !!(m.push && push.sub && Notification.permission === "granted");
  const tijd = m.tijd || "18:00";
  return `
  <div class="panel">
    <h4>Meldingen</h4>
    <p>${on ? `Aan. Je krijgt elke dag om ${esc(tijd)} een melding als er planten water nodig hebben. Hebben je huisgenoten al water gegeven, dan krijg je niets.`
            : Notification.permission === "denied" ? "Meldingen zijn geblokkeerd. Zet ze aan via de instellingen van je telefoon of browser."
            : "Uit. Kies een tijdstip en zet de meldingen aan."}</p>
    <label class="f">Tijdstip<input type="time" id="nTime" value="${esc(tijd)}" min="06:00" max="22:00" step="300"></label>
    ${on ? `<button class="btn full" style="margin-top:10px" data-push-test>Testmelding sturen</button>
            <button class="btn full" style="margin-top:10px" data-push-off>Meldingen uitzetten</button>`
         : Notification.permission !== "denied" ? `<button class="btn leaf full" style="margin-top:10px" data-push-on>Meldingen aanzetten</button>` : ""}
    <div class="symptoms" style="margin-top:14px" role="radiogroup" aria-label="Soort melding">
      <label class="sym"><input type="radio" name="nmode" value="stil" ${m.stil ? "checked" : ""}><span>Alleen op het scherm, zonder geluid of trillen</span></label>
      <label class="sym"><input type="radio" name="nmode" value="geluid" ${!m.stil ? "checked" : ""}><span>Met geluid en trillen</span></label>
    </div>
    <p class="hint">Je kunt een tijd kiezen tussen 06:00 en 22:00. De melding komt binnen vijf minuten na het gekozen tijdstip.${isBrave() ? " Gebruik je Brave? Zet dan in Brave bij Instellingen, Privacy en beveiliging de optie Google-services voor pushberichten gebruiken aan." : ""}</p>
  </div>`;
}
function pushError(e) {
  const n = e?.name || "", msg = String(e?.message || "");
  if (n === "NotAllowedError") return "Je hebt meldingen niet toegestaan.";
  if (/push service|AbortError/i.test(n + msg) && isBrave()) return "Brave blokkeert pushmeldingen. Zet in Brave bij Instellingen, Privacy en beveiliging de optie Google-services voor pushberichten gebruiken aan, en probeer het opnieuw.";
  return e?.msg || "Aanzetten lukte niet. Probeer het opnieuw.";
}
async function pushSave(sub) {
  const j = sub.toJSON();
  await cloud.rpc("save_subscription", {
    p_household: cloud.cfg.household, p_endpoint: j.endpoint, p_p256dh: j.keys?.p256dh || null, p_auth: j.keys?.auth || null,
    p_time: state.meldingen.tijd || "18:00", p_tz: Intl.DateTimeFormat().resolvedOptions().timeZone || "Europe/Amsterdam"
  });
}
async function pushOn() {
  try {
    const t = $("#nTime")?.value; if (t) state.meldingen.tijd = t;
    const perm = await Notification.requestPermission();
    if (perm !== "granted") { renderSheet(); return; }
    const reg = await swReady();
    if (!reg?.pushManager) throw { msg: "Deze browser ondersteunt geen pushmeldingen. Op een iPhone werkt het alleen als de app op het beginscherm staat." };
    let sub = await reg.pushManager.getSubscription();
    if (sub && sub.options?.applicationServerKey && bytesB64u(sub.options.applicationServerKey) !== push.key) { await sub.unsubscribe(); sub = null; }
    sub = sub || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64uBytes(push.key) });
    await pushSave(sub);
    push.sub = sub;
    state.meldingen.push = true; state.meldingen.aan = true;
    await store.set("meldingen", state.meldingen);
    toast(`Meldingen staan aan om ${state.meldingen.tijd || "18:00"}`);
  } catch (e) { toast(pushError(e)); }
  renderSheet();
}
async function pushOff() {
  try {
    if (push.sub) { const ep = push.sub.endpoint; await push.sub.unsubscribe().catch(() => {}); await cloud.rpc("delete_subscription", { p_endpoint: ep }).catch(() => {}); }
    push.sub = null; state.meldingen.push = false; state.meldingen.aan = false;
    await store.set("meldingen", state.meldingen);
    toast("Meldingen staan uit");
  } catch (e) { toast(e?.msg || "Uitzetten lukte niet."); }
  renderSheet();
}
async function pushTime(v) {
  if (!/^\d{2}:\d{2}$/.test(v)) return;
  if (v < "06:00" || v > "22:00") { toast("Kies een tijd tussen 06:00 en 22:00."); renderSheet(); return; }
  state.meldingen.tijd = v;
  await store.set("meldingen", state.meldingen);
  if (state.meldingen.push && push.sub) {
    try { await pushSave(push.sub); toast(`Meldingen komen voortaan om ${v}`); } catch (e) { toast(e?.msg || "Opslaan lukte niet."); }
  }
  renderSheet();
}
async function pushTest() {
  try { await cloud.rpc("push_test", { p_endpoint: push.sub.endpoint }); toast("Testmelding aangevraagd. Hij komt binnen vijf minuten."); }
  catch (e) { toast(e?.msg || "De testmelding lukte niet."); }
}

/* admin: connect the household's Supabase to send notifications */
function pushSetupBody() {
  const c = sheetCtx;
  return `
  <p style="margin-top:4px">Je doet dit één keer voor de hele lijst. De stappen in Supabase doe je het makkelijkst op een laptop. Daarna tik je hier op je telefoon op Koppelen.</p>
  <a class="btn full" style="margin-top:10px;text-decoration:none;color:inherit" href="handleiding.html#meldingen" target="_blank" rel="noopener">Handleiding openen</a>
  <p class="hint">Heb je het script uitgevoerd en de functie plat-push aangemaakt met Verify JWT uit? Tik dan op Koppelen.</p>
  ${c.error ? `<div class="err">${esc(c.error)}</div>` : ""}
  ${c.busy ? `<div class="thinking"><span class="spin"></span>${esc(c.busy)}</div>` : `<button class="btn leaf full" style="margin-top:16px" data-push-connect>Koppelen</button>`}`;
}
async function pushConnect() {
  const c = sheetCtx;
  c.error = ""; c.busy = "Koppelen…"; renderSheet();
  const fnUrl = cloud.cfg.url + "/functions/v1/plat-push";
  try {
    let st = 0;
    try { st = (await fetch(fnUrl, { method: "POST", body: "{}" })).status; } catch { st = -1; }
    if (st !== 403) throw { msg: st === 404 ? "De functie plat-push is niet gevonden. Controleer of je hem precies zo hebt genoemd en hebt gedeployed."
      : "De functie plat-push is niet bereikbaar. Controleer of hij is gedeployed en of Verify JWT uit staat." };
    const kp = await crypto.subtle.generateKey({ name: "ECDSA", namedCurve: "P-256" }, true, ["sign", "verify"]);
    const pub = bytesB64u(await crypto.subtle.exportKey("raw", kp.publicKey));
    const { kty, crv, x, y, d } = await crypto.subtle.exportKey("jwk", kp.privateKey);
    await cloud.rpc("setup_push", { p_household: cloud.cfg.household, p_function_url: fnUrl, p_public: pub, p_private: { kty, crv, x, y, d }, p_subject: location.origin + location.pathname });
    push.key = pub; push.sub = null; state.meldingen.push = false;
    await store.set("meldingen", state.meldingen);
    openSheet({ mode: "settings" });
    toast("Gekoppeld. Kies nu je tijdstip en zet de meldingen aan.");
  } catch (e) {
    c.busy = "";
    c.error = (e?.code === "PGRST202" || /ingericht/.test(e?.msg || "")) ? "Het meldingen-script (supabase-meldingen.sql) is nog niet uitgevoerd in Supabase." : (e?.msg || "Koppelen lukte niet.");
    renderSheet();
  }
}

async function exportBackup() {

  const file = new File([blob], name, { type: "application/json" });

  }

/* ---------- images ---------- */
async function loadImage(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(new Error("decode")); img.src = url; });
    return img;
  } finally { setTimeout(() => URL.revokeObjectURL(url), 2000); }
}
function drawScaled(img, max) {
  const r = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement("canvas");
  c.width = Math.round(img.naturalWidth * r); c.height = Math.round(img.naturalHeight * r);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return c;
}
async function processPhoto(file) {
  const img = await loadImage(file);
  const big = drawScaled(img, 1280);
  const blob = await new Promise(r => big.toBlob(r, "image/jpeg", 0.85));
  const small = drawScaled(img, 900);
  return { blob, dataUrl: small.toDataURL("image/jpeg", 0.75) };
}

let toastTimer;
function toast(msg, undo) {
  clearTimeout(toastTimer);
  const host = $("#toastHost");
  host.innerHTML = `<div class="toast" role="status"><span>${esc(msg)}</span>${undo ? `<button id="undoBtn">Ongedaan maken</button>` : ""}</div>`;
  if (undo) $("#undoBtn").onclick = () => { host.innerHTML = ""; undo(); };
  toastTimer = setTimeout(() => host.innerHTML = "", 5000);
}
async function reload() {
  if (isCloud()) {
    const st = await cloud.rpc("my_status", { p_household: cloud.cfg.household });
    if (!st || st.status !== "active") { await lostAccess("Je hebt geen toegang meer tot de gedeelde lijst."); return; }
    Object.assign(cloud.cfg, { role: st.role, name: st.name, invite: st.invite, display: st.display });
    store.set("cloud", cloud.cfg).catch(() => {});
    state.members = (await cloud.req(`/rest/v1/members?select=user_id,display_name,role,status,created_at&household_id=eq.${cloud.hid()}&order=created_at`)) || [];
  } else if (cloud.cfg?.status === "pending") {
    state.members = [];
  }
  const list = await api.list();
  state.plants = list.map(p => ({ ...p, label: str(p.label) || "Plant" }));
  state.loaded = true; state.loadError = ""; state.offline = false;
  render();
  if (sheetCtx?.mode === "detail") renderSheet();
}
function setLocal(p) {
  const q = { ...p, label: str(p.label) || "Plant" };
  const i = state.plants.findIndex(x => x.id === p.id);
  if (i >= 0) state.plants[i] = q; else state.plants.push(q);
  render(); if (sheetCtx?.mode === "detail") renderSheet();
}
async function patch(id, fields, msg, undo) {
  try { const p = await api.patch(id, fields); setLocal(p); if (msg) toast(msg, undo); return p; }
  catch (e) { toast(e?.msg || "Opslaan lukte niet."); reload().catch(() => {}); return null; }

});
const nameOf = id => (state.members || []).find(m => m.user_id === id)?.display_name || "Deze persoon";
document.addEventListener("visibilitychange", () => { if (!document.hidden) { render(); if (sheetCtx?.mode === "detail") renderSheet(); refresh(); } });
let refreshing = false;
async function refresh() {
  if (refreshing || !state.loaded || document.hidden) return;
  const pending = cloud.cfg?.status === "pending";
  if (!isCloud() && !pending) return;
  if (sheetCtx && !["detail", "settings"].includes(sheetCtx.mode)) return;
  if (["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement?.tagName)) return;
  refreshing = true;
  try {
    if (pending) {
      const st = await cloud.rpc("my_status", { p_household: cloud.cfg.household });
      if (st?.status === "active") { Object.assign(cloud.cfg, { status: "active", role: st.role, name: st.name, invite: st.invite }); await cloud.saveCfg(); await reload(); toast(`Je bent geaccepteerd voor ${cloud.cfg.name}`); }
      else if (!st) await lostAccess("De beheerder heeft je aanvraag niet geaccepteerd.");
    } else {
      await reload();
    }
    if (sheetCtx?.mode === "settings") renderSheet();
  } catch (e) { if (e?.offline && !state.offline) { state.offline = true; render(); } }
  refreshing = false;
}
setInterval(refresh, 20000);

/* ---------- boot ---------- */
render();
(async () => {
  try { await store.open(); }
  catch {
    $("#main").innerHTML = brandBar() + `<div class="empty"><strong>De opslag op deze telefoon is niet beschikbaar</strong><p>Open de app in Chrome of Safari, niet in een incognitovenster.</p></div>`;
    return;
  }
  state.key = (await store.get("plantnetKey").catch(() => "")) || "";
  state.meldingen = { aan: false, stil: true, ...((await store.get("meldingen").catch(() => null)) || {}) };
  cloud.cfg = (await store.get("cloud").catch(() => null)) || null;
  for (const ph of ((await store.photoAll().catch(() => [])) || [])) state.photoCache[ph.id] = ph.data;
  const inv = parseInvite(location.hash);
  if (location.hash.startsWith("#join=")) history.replaceState(null, "", location.pathname + location.search);
  try { await reload(); }
  catch (e) {
    const cache = isCloud() ? await store.get("cloudCache").catch(() => null) : null;
    if (cache) { state.plants = cache.map(p => ({ ...p, label: str(p.label) || "Plant" })); state.loaded = true; state.offline = true; render(); }
    else { state.loadError = e?.msg || "Onbekende fout."; render(); }
  }
  if (inv) openSheet({ mode: "cloudJoin", link: inv });
  if (navigator.storage?.persist) navigator.storage.persist().catch(() => {});
})();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").then(() => checkNotifSupport()).catch(() => {});
})();

</script>
</body>
